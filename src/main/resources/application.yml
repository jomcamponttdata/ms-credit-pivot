spring:
  application:
    name: credit-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  r2dbc:
    url: ${CREDIT_R2DBC_URL:r2dbc:postgresql://localhost:5432/credit_db}
    username: ${CREDIT_DB_USERNAME:banking}
    password: ${CREDIT_DB_PASSWORD}
  sql:
    init:
      mode: always
credit:
  pagination:
    default-page: ${CREDIT_DEFAULT_PAGE:0}
    default-size: ${CREDIT_DEFAULT_PAGE_SIZE:20}
    max-size: ${CREDIT_MAX_PAGE_SIZE:100}
  services:
    customer-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
    transaction-url: ${TRANSACTION_SERVICE_URL:http://localhost:8084}
    transaction-timeout-ms: ${CREDIT_TRANSACTION_TIMEOUT_MS:3000}
server:
  port: ${CREDIT_SERVICE_PORT:8083}
logging:
  level:
    com.pivot.banking.credit: INFO
